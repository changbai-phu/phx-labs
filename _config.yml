title: pHX Labs
tagline: "Building | Experimenting | Documenting along the way."
description: "Personal portfolio showcasing projects, AI workflows, and blog."
url: ""

theme: jekyll-theme-chirpy

# Site settings
# Extract these values from `_profiles/author.yml` and front matter.
chirpy:
  mode: default
  theme: default
  # Sidebar avatar and social links
  avatar: ""  # empty = no avatar
  social:
    github:
      - url: https://github.com/changbai-phu
    email:
      - url: "mailto:peiqi.xing.hu@gmail.com"

# Jekyll plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-twitter-plugin
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-archives

# Disable PWA functionality to avoid theme version conflicts
pwa:
  enabled: false

# Disable RSS/Atom feed
feed:
  path: ""

# Enable tabs collection for navigation
collections:
  tabs:
    output: true
    sort_by: order
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/








